# Tests every push and pull request, then builds the Docker images and smoke-tests
# them: Kerberos and OCR inside the api image, and the production Compose stack
# through nginx (.github/ci/). When the repository variable PUBLISH_IMAGES is
# "true" (not set yet: off until the app is ready), pushes to main also publish
# the images to GitHub Container Registry (ghcr.io):
#
#   ghcr.io/<owner>/corp-library-api:latest   (+ :sha-<commit>)   used by api and worker
#   ghcr.io/<owner>/corp-library-web:latest   (+ :sha-<commit>)   used by web
#
# The server deploys with:  docker compose pull && docker compose up -d
# Roll back by pinning a previous sha-<commit> tag in docker-compose.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16  # same image as production
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml
      - run: uv sync --locked

      - name: Tests on SQLite
        run: uv run pytest

      - name: Tests on PostgreSQL
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build  # type-checks (tsc) and bundles

  images:
    name: Images (build + smoke test)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # The names docker-compose.yml runs; the smoke test starts that file as is.
      API_IMAGE: ghcr.io/jlleongarcia/corp-library-api
      WEB_IMAGE: ghcr.io/jlleongarcia/corp-library-web
      # Only pushes to main publish, and only once PUBLISH_IMAGES is "true".
      PUSH: ${{ vars.PUBLISH_IMAGES == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build both images into the local Docker engine, tagged as Compose expects.
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          load: true
          tags: ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          load: true
          tags: ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Self-test api image (gssapi, Tesseract spa+eng, OCR of a scanned PDF)
        run: >
          docker run --rm -e OCR_ENABLED=true -e PYTHONPATH=/app
          -v "$PWD/.github/ci:/ci:ro" "$API_IMAGE:latest" python /ci/image_selftest.py

      - name: Smoke-test the Compose stack through nginx
        run: bash .github/ci/smoke_test.sh

      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.yml -f .github/ci/compose.ci.yml logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f .github/ci/compose.ci.yml down -v || true

      # ── Publish (tested images only; the cache makes these rebuilds instant) ──
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: api-meta
        if: env.PUSH == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - id: web-meta
        if: env.PUSH == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Publish api image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api

      - name: Publish web image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web
