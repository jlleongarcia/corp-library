# Tests every push and pull request. When the repository variable PUBLISH_IMAGES
# is "true" (not set yet: off until the app is ready), it also builds the Docker
# images and, on main, pushes them to GitHub Container Registry (ghcr.io):
#
#   ghcr.io/<owner>/corp-library-api:latest   (+ :sha-<commit>)   used by api and worker
#   ghcr.io/<owner>/corp-library-web:latest   (+ :sha-<commit>)   used by web
#
# The server deploys with:  docker compose pull && docker compose up -d
# Roll back by pinning a previous sha-<commit> tag in docker-compose.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16  # same image as production
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml
      - run: uv sync --locked

      - name: Tests on SQLite
        run: uv run pytest

      - name: Tests on PostgreSQL
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build  # type-checks (tsc) and bundles

  images:
    name: Image ${{ matrix.image }}
    needs: [backend, frontend]
    # Off until the app is ready to deploy. To enable: repo Settings → Secrets and
    # variables → Actions → Variables → New repository variable PUBLISH_IMAGES = true.
    if: vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: backend
          - image: web
            context: frontend
    env:
      # Pull requests only check that the images build; main also publishes them.
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/corp-library-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
