[project]
name = "corp-library-backend"
version = "0.3.0"
description = "Corp Library API and background worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "ldap3>=2.9.1",
    "smbprotocol>=1.14",
    "pypdfium2>=5.14.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
sso = [
    "gssapi>=1.8 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pgserver>=0.1.4",  # embedded PostgreSQL for scripts/dev.py and scripts/pytest_postgres.py
]

[tool.uv]
package = false  # an application run from this folder, not an installable package

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
