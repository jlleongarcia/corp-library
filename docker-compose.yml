# Corp Library: production stack for the department Linux server.
#
#   (start the traefik-proxy project first; it owns ports 80/443)
#   cp .env.example .env   # then fill in the values
#   docker compose up -d --build
#
# Every service restarts automatically, including after a server reboot.

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://corplib:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/corplib

services:
  db:
    image: pgvector/pgvector:pg16  # PostgreSQL 16 with pgvector (used from phase 3)
    restart: unless-stopped
    environment:
      POSTGRES_DB: corplib
      POSTGRES_USER: corplib
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corplib -d corplib"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/jlleongarcia/corp-library-api:latest
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: ghcr.io/jlleongarcia/corp-library-api:latest
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment: *backend-env
    stop_grace_period: 60s  # let a running job reach a safe point
    depends_on:
      api:
        condition: service_healthy  # the API runs migrations first

  web:
    image: ghcr.io/jlleongarcia/corp-library-api:latest
    restart: unless-stopped
    # No published ports: the shared Traefik proxy (traefik-proxy project) terminates
    # HTTPS on 443 and routes APP_HOST here over the `proxy` network.
    networks: [default, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.corplibrary.rule=Host(`${APP_HOST:?set APP_HOST in .env}`)
      - traefik.http.routers.corplibrary.entrypoints=websecure
      - traefik.http.services.corplibrary.loadbalancer.server.port=80
    depends_on:
      - api

  backup:
    image: pgvector/pgvector:pg16  # same version as db, for pg_dump compatibility
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: corplib
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: corplib
      BACKUP_HOUR: ${BACKUP_HOUR:-1}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:

networks:
  proxy:
    external: true  # created by the traefik-proxy project; start that first
