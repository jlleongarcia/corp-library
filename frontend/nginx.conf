# Behind Traefik: keep the scheme and client IP Traefik reports instead of
# replacing them with this hop's values (http, Traefik's container IP).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_real_ip $client_ip {
    default $http_x_real_ip;
    ''      $remote_addr;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    # API: strip the /api prefix and forward to FastAPI. The Authorization header
    # (Kerberos tickets on /api/auth/sso) is passed through unchanged.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass         http://api:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $client_ip;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;  # large report exports
    }

    # Downloads stream straight from the file server: don't spool them to disk here.
    location ~ ^/api/documents/\d+/(download|preview)$ {
        include /etc/nginx/snippets/security-headers.conf;
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $client_ip;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_buffering    off;
        proxy_read_timeout 600s;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback; index.html itself must not be cached
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
