# Included by every location in nginx.conf: an add_header inside a location
# stops nginx from inheriting the server-level ones (BUG-011).
add_header X-Content-Type-Options nosniff always;
# SAMEORIGIN, not DENY: the document page shows PDF previews in a frame from this origin.
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy same-origin always;
# HTTPS only for this host from now on (BUG-031). Browsers only honour it over HTTPS
# (Traefik), so plain-HTTP tests are unaffected. No includeSubDomains: other apps
# on the domain are not ours to decide for.
add_header Strict-Transport-Security "max-age=31536000" always;
